# Lint, typecheck, build and test both packages on every pull request into
# develop, and on every push to develop and main.
#
# The two packages are separate npm projects with their own lockfiles, so they
# get their own jobs: a failure in one says which one without reading the log.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push to the same branch makes the run in flight irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test -- --run

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Test
        run: npm test

      # Last, because it is the slowest and a lint or test failure is the more
      # useful thing to be told about first.
      - name: Typecheck and build
        run: npm run build
        env:
          # Placeholders, not secrets. Phase 5 removed every VITE_ key that was
          # an LLM credential, but the Firebase web config and the map key are
          # still read at runtime, and `lib/firebase.ts` throws at module scope
          # when one is missing. That is a runtime failure rather than a build
          # one, so these exist to keep the values in front of whoever wires
          # the real deploy: a bundle built without them white-screens on load.
          VITE_API_URL: http://localhost:3001
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder
          VITE_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
          VITE_GEOAPIFY_API_KEY: ci-placeholder

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Runs the suite inside `firebase emulators:exec`, against the real
      # `firestore.rules` in the repo root.
      - name: Rules
        run: npm run test:rules

  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: >
          npx prettier@3 --check
          "client/src/**/*.{ts,tsx}"
          "client/*.config.ts"
          "server/src/**/*.ts"
          "server/scripts/*.ts"
          "shared/*.d.ts"
          "docs/**/*.md"
          "docs/api/*.json"
